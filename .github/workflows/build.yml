name: Build GeoPolMap Forge 1.20.1 JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Unpack GeoPolMap Source Project
        run: |
          cat << 'B64EOF' > /tmp/project.b64
          
          B64EOF
          tr -d ' \n\r' < /tmp/project.b64 | base64 -d > /tmp/project.zip
          unzip -o /tmp/project.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Compile & Reobfuscate Mod JAR (Forge 1.20.1)
        run: gradle build --no-daemon

      - name: Upload Ready Mod JAR (geopolmap-1.0.0.jar)
        uses: actions/upload-artifact@v4
        with:
          name: geopolmap-1.20.1-jar
          path: build/libs/*.jar
